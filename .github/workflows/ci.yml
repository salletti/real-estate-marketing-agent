name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Create .env from secrets
        run: |
          cat > .env <<EOF
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          EOF

      - name: Start services
        run: docker compose up -d --build --wait
        timeout-minutes: 5

      - name: Verify MCP server health (regression guard for 421)
        run: |
          curl -f http://localhost:8001/health
          curl -f http://localhost:8002/health

      - name: Unit tests (no live services required)
        run: docker compose exec -T backend pytest tests/ -v -m "not integration"

      - name: Integration tests (live MCP transport)
        run: docker compose exec -T backend pytest tests/infrastructure/mcp/test_mcp_transport.py -v -m integration
        continue-on-error: false

      - name: Tear down
        if: always()
        run: docker compose down -v
